[package]
name = "lynshen-tui"
version.workspace = true
license.workspace = true
authors.workspace = true
edition = "2021"

[features]
bench = []
# Renders sample frames for design previews (examples/tui_preview.rs).
preview = []

[dependencies]
base64 = "0.22"
lynshen-agent-core = { path = "../agent-core" }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
serde_json = "1"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
# The terminal background query polls stdin (theme.rs).
libc = "0.2"

[[example]]
name = "tui_preview"
required-features = ["preview"]

[[bench]]
name = "render_frame"
harness = false
required-features = ["bench"]
